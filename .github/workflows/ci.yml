name: Insurance Premium CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==========================================
  # CI - Build, Test, SonarCloud
  # ==========================================
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn clean test

      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn verify sonar:sonar \
            -Dsonar.organization=udayyadav22-crypto \
            -Dsonar.projectKey=udayyadav22-crypto_insurance-premium-app \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: insurance-premium-app
          path: target/insurance-premium-app-1.0.0.jar
          if-no-files-found: error


  # ==========================================
  # UAT - Deploy application to Port 8081
  # ==========================================
  deploy-to-uat:

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: build-and-test

    runs-on: ubuntu-latest

    steps:

      - name: Download application artifact
        uses: actions/download-artifact@v5
        with:
          name: insurance-premium-app
          path: deployment

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/github_actions_ec2

          chmod 600 ~/.ssh/github_actions_ec2

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy JAR to UAT
        run: |
          ssh \
            -i ~/.ssh/github_actions_ec2 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p /home/${{ secrets.EC2_USER }}/insurance-premium-app-uat"

          scp \
            -i ~/.ssh/github_actions_ec2 \
            deployment/insurance-premium-app-1.0.0.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/insurance-premium-app-uat/

      - name: Start UAT application
        run: |
          ssh \
            -i ~/.ssh/github_actions_ec2 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

          cd /home/ubuntu/insurance-premium-app-uat

          echo "Stopping existing UAT application..."

          if pgrep -f '[i]nsurance-premium-app-1.0.0.jar' > /dev/null; then
            pkill -f '[i]nsurance-premium-app-1.0.0.jar'
            sleep 2
          fi

          echo "Starting UAT application..."

          APP_PORT=8081 nohup java -jar insurance-premium-app-1.0.0.jar \
            > application.log 2>&1 &

          echo "Waiting for UAT startup..."

          sleep 5

          echo "Checking UAT application..."

          if pgrep -f '[i]nsurance-premium-app-1.0.0.jar' > /dev/null; then
            echo "UAT application process is running."
          else
            echo "UAT application failed to start."
            tail -n 50 application.log
            exit 1
          fi

          echo "UAT health check..."

          HEALTH_RESPONSE=$(curl -s http://localhost:8081/health)

          echo "Health response: $HEALTH_RESPONSE"

          if [ "$HEALTH_RESPONSE" = "OK" ]; then
            echo "UAT deployment successful."
          else
            echo "UAT deployment failed."
            tail -n 50 application.log
            exit 1
          fi

          EOF


  # ==========================================
  # Automated UAT API Testing
  # ==========================================
  uat-api-testing:

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: deploy-to-uat

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Run UAT API tests
        run: |
          chmod +x tests/api-test.sh

          sed -i 's|BASE_URL="http://localhost:8081"|BASE_URL="http://${{ secrets.EC2_HOST }}:8081"|' tests/api-test.sh

          ./tests/api-test.sh


  # ==========================================
  # Production Deployment
  # Human UAT Approval Required
  # ==========================================
  deploy-to-production:

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: uat-api-testing

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Download application artifact
        uses: actions/download-artifact@v5
        with:
          name: insurance-premium-app
          path: deployment

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/github_actions_ec2

          chmod 600 ~/.ssh/github_actions_ec2

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy JAR to Production
        run: |
          scp \
            -i ~/.ssh/github_actions_ec2 \
            deployment/insurance-premium-app-1.0.0.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/insurance-premium-app/

      - name: Deploy Production application
        run: |
          ssh \
            -i ~/.ssh/github_actions_ec2 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

          cd /home/ubuntu/insurance-premium-app

          echo "Stopping old Production application..."

          if pgrep -f '[i]nsurance-premium-app-1.0.0.jar' > /dev/null; then
            pkill -f '[i]nsurance-premium-app-1.0.0.jar'
            sleep 2
          fi

          echo "Starting Production application..."

          nohup java -jar insurance-premium-app-1.0.0.jar \
            > application.log 2>&1 &

          echo "Waiting for Production startup..."

          sleep 5

          echo "Production health check..."

          HEALTH_RESPONSE=$(curl -s http://localhost:8080/health)

          echo "Health response: $HEALTH_RESPONSE"

          if [ "$HEALTH_RESPONSE" = "OK" ]; then
            echo "Production deployment successful."
          else
            echo "Production deployment failed."
            tail -n 50 application.log
            exit 1
          fi

          EOF
