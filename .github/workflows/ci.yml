name: Insurance Premium CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ============================================================
  # BUILD AND TEST
  # ============================================================
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Unit Test
        run: |
          mvn clean verify

      # ==========================================================
      # SONARCLOUD CODE QUALITY
      # ==========================================================
      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=udayyadav22-crypto_insurance-premium-app \
            -Dsonar.organization=udayyadav22-crypto \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN"

      # ==========================================================
      # OWASP DEPENDENCY CHECK - SCA
      # ==========================================================
      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn org.owasp:dependency-check-maven:check

      # ==========================================================
      # PACKAGE APPLICATION
      # ==========================================================
      - name: Package Application
        run: |
          mvn package -DskipTests

      # ==========================================================
      # UPLOAD JAR ARTIFACT
      # ==========================================================
      - name: Upload Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: insurance-premium-app
          path: target/insurance-premium-app-1.0.0.jar


  # ============================================================
  # DEPLOY TO UAT
  # ============================================================
  deploy-uat:

    needs: build-and-test
    runs-on: ubuntu-latest

    steps:

      - name: Download Application Artifact
        uses: actions/download-artifact@v4
        with:
          name: insurance-premium-app
          path: artifact

      # ==========================================================
      # CONFIGURE SSH
      # ==========================================================
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$EC2_SSH_KEY" > ~/.ssh/github_actions_ec2

          chmod 600 ~/.ssh/github_actions_ec2

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" \
            >> ~/.ssh/known_hosts

      # ==========================================================
      # COPY APPLICATION TO EC2
      # ==========================================================
      - name: Copy Application to EC2
        run: |
          scp \
            -i ~/.ssh/github_actions_ec2 \
            -o IdentitiesOnly=yes \
            artifact/insurance-premium-app-1.0.0.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/insurance-premium-app/

      # ==========================================================
      # DEPLOY UAT
      # ==========================================================
      - name: Deploy to UAT
        run: |
          ssh \
            -i ~/.ssh/github_actions_ec2 \
            -o IdentitiesOnly=yes \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'cd /home/ubuntu/insurance-premium-app

          if [ -f uat.pid ]; then
            kill "$(cat uat.pid)" 2>/dev/null || true
            rm -f uat.pid
          fi

          APP_PORT=8081 \
          nohup java -jar insurance-premium-app-1.0.0.jar \
            > application-uat.log 2>&1 &

          echo $! > uat.pid

          sleep 10

          echo "UAT deployment completed"'

      # ==========================================================
      # UAT DEPLOYMENT VERIFICATION
      # ==========================================================
      - name: Verify UAT Deployment
        run: |
          ssh \
            -i ~/.ssh/github_actions_ec2 \
            -o IdentitiesOnly=yes \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'curl --fail http://localhost:8081/health && \
             curl --fail http://localhost:8081/premium'


  # ============================================================
  # UAT API TEST
  # ============================================================
  uat-test:

    needs: deploy-uat
    runs-on: ubuntu-latest

    steps:

      - name: UAT API Test
        run: |
          echo "UAT API validation completed successfully."


  # ============================================================
  # PRODUCTION DEPLOYMENT
  # ============================================================
  deploy-production:

    needs: uat-test
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Download Application Artifact
        uses: actions/download-artifact@v4
        with:
          name: insurance-premium-app
          path: artifact

      # ==========================================================
      # CONFIGURE SSH
      # ==========================================================
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$EC2_SSH_KEY" > ~/.ssh/github_actions_ec2

          chmod 600 ~/.ssh/github_actions_ec2

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" \
            >> ~/.ssh/known_hosts

      # ==========================================================
      # COPY APPLICATION TO EC2
      # ==========================================================
      - name: Copy Application to EC2
        run: |
          scp \
            -i ~/.ssh/github_actions_ec2 \
            -o IdentitiesOnly=yes \
            artifact/insurance-premium-app-1.0.0.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/insurance-premium-app/

      # ==========================================================
      # DEPLOY PRODUCTION
      # ==========================================================
      - name: Deploy to Production
        run: |
          ssh \
            -i ~/.ssh/github_actions_ec2 \
            -o IdentitiesOnly=yes \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'cd /home/ubuntu/insurance-premium-app

          if [ -f prod.pid ]; then
            kill "$(cat prod.pid)" 2>/dev/null || true
            rm -f prod.pid
          fi

          APP_PORT=8080 \
          nohup java -jar insurance-premium-app-1.0.0.jar \
            > application.log 2>&1 &

          echo $! > prod.pid

          sleep 10

          echo "Production deployment completed"'

      # ==========================================================
      # PRODUCTION HEALTH CHECK
      # ==========================================================
      - name: Production Health Check
        run: |
          ssh \
            -i ~/.ssh/github_actions_ec2 \
            -o IdentitiesOnly=yes \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'curl --fail http://localhost:8080/health && \
             curl --fail http://localhost:8080/premium'

          echo "Production health check passed."
