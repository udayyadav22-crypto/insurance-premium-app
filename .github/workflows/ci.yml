name: Insurance Premium CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ============================================================
  # CI - Build, Unit Test, SonarCloud, SCA
  # ============================================================
  build-and-test:

    runs-on: ubuntu-latest

    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:

      # Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v5

      # Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Build and Unit Tests
      - name: Build and Unit Test
        run: mvn clean verify

      # SonarCloud Analysis
      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=udayyadav22-crypto_insurance-premium-app \
            -Dsonar.organization=udayyadav22-crypto \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${SONAR_TOKEN}

      # OWASP Dependency-Check - SCA
      - name: OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check

      # Package Application
      - name: Package Application
        run: |
          mvn package -DskipTests

      # Upload JAR
      - name: Upload Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: insurance-premium-app
          path: target/insurance-premium-app-1.0.0.jar


  # ============================================================
  # UAT DEPLOYMENT
  # ============================================================
  deploy-uat:

    needs: build-and-test

    runs-on: ubuntu-latest

    steps:

      # Download JAR
      - name: Download Application Artifact
        uses: actions/download-artifact@v4
        with:
          name: insurance-premium-app
          path: artifact

      # Configure SSH
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$EC2_SSH_KEY" > ~/.ssh/github_actions_ec2

          chmod 600 ~/.ssh/github_actions_ec2

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" \
            >> ~/.ssh/known_hosts

      # Copy JAR to EC2
      - name: Copy Application to EC2
        run: |
          scp \
            -i ~/.ssh/github_actions_ec2 \
            -o IdentitiesOnly=yes \
            artifact/insurance-premium-app-1.0.0.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/insurance-premium-app/

      # Deploy UAT
      - name: Deploy to UAT
        run: |
          ssh \
            -i ~/.ssh/github_actions_ec2 \
            -o IdentitiesOnly=yes \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

            cd /home/ubuntu/insurance-premium-app

            # Stop previous UAT instance only
            if [ -f uat.pid ]; then
              kill "$(cat uat.pid)" 2>/dev/null || true
              rm -f uat.pid
            fi

            # Start UAT on port 8081
            APP_PORT=8081 \
            nohup java -jar insurance-premium-app-1.0.0.jar \
              > application-uat.log 2>&1 &

            echo $! > uat.pid

            sleep 10

            echo "UAT deployment completed"

            EOF


  # ============================================================
  # UAT API TEST
  # ============================================================
  uat-test:

    needs: deploy-uat

    runs-on: ubuntu-latest

    steps:

      - name: UAT API Test
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |

          echo "Testing UAT Health endpoint..."

          curl \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            http://${EC2_HOST}:8081/health

          echo ""

          echo "Testing UAT Premium endpoint..."

          curl \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            http://${EC2_HOST}:8081/premium

          echo ""

          echo "UAT API tests passed"


  # ============================================================
  # PRODUCTION DEPLOYMENT
  # ============================================================
  deploy-production:

    needs: uat-test

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      # Download JAR
      - name: Download Application Artifact
        uses: actions/download-artifact@v4
        with:
          name: insurance-premium-app
          path: artifact

      # Configure SSH
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$EC2_SSH_KEY" > ~/.ssh/github_actions_ec2

          chmod 600 ~/.ssh/github_actions_ec2

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" \
            >> ~/.ssh/known_hosts

      # Copy JAR
      - name: Copy Application to EC2
        run: |
          scp \
            -i ~/.ssh/github_actions_ec2 \
            -o IdentitiesOnly=yes \
            artifact/insurance-premium-app-1.0.0.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/insurance-premium-app/

      # Production deployment
      - name: Deploy to Production
        run: |
          ssh \
            -i ~/.ssh/github_actions_ec2 \
            -o IdentitiesOnly=yes \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

            cd /home/ubuntu/insurance-premium-app

            # Stop previous production instance only
            if [ -f prod.pid ]; then
              kill "$(cat prod.pid)" 2>/dev/null || true
              rm -f prod.pid
            fi

            # Start Production on port 8080
            APP_PORT=8080 \
            nohup java -jar insurance-premium-app-1.0.0.jar \
              > application.log 2>&1 &

            echo $! > prod.pid

            sleep 10

            echo "Production deployment completed"

            EOF


  # ============================================================
  # PRODUCTION HEALTH CHECK
  # ============================================================
  production-health-check:

    needs: deploy-production

    runs-on: ubuntu-latest

    steps:

      - name: Production Health Check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |

          echo "Checking Production Health endpoint..."

          curl \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            http://${EC2_HOST}:8080/health

          echo ""

          echo "Checking Production Premium endpoint..."

          curl \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            http://${EC2_HOST}:8080/premium

          echo ""

          echo "Production health check passed"
